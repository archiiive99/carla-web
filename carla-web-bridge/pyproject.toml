[project]
name = "carla-web-bridge"
version = "0.1.0"
description = "Python bridge between CARLA simulator and web frontend"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Required by pytest-asyncio 0.23+: implicit default ("function") was
# deprecated in 0.22 and becomes an error in a future release. Set
# explicitly to preserve the previous behavior — each async fixture
# gets its own event loop per-test.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

markers = [
    "flaky: quarantined live-runtime instability scenario",
]

[tool.ruff]
# Python backend files lean long because of FastAPI decorator chains
# and CARLA-typed function signatures; 100 keeps readable one-liners
# without forcing micro-wraps.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default `E + F + W` is too narrow for a backend. These add:
# - B: bugbear (exception chaining, mutable defaults, zip strict)
# - UP: pyupgrade (use the project's 3.10+ idioms)
# - I: import sorting
# - SIM: simplifications (contextlib.suppress, dict shortcuts)
# - C4: comprehension cleanups
# - RET: return-statement cleanups
# - PIE: small refactors
select = ["E", "F", "W", "B", "UP", "I", "SIM", "C4", "RET", "PIE"]
# Keep the line-too-long check off here — we run the project-wide
# formatter for actual wrapping, and 100 is our agreed ceiling.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# disallow_untyped_defs = true
# — turn this on after the tests/ directory catches up.
